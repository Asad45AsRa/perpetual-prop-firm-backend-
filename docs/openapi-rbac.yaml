        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/trading/accounts/{accountId}:
    get:
      tags: [Trading]
      summary: Live account overview (balance, equity, margin, exposure, open positions)
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
      responses:
        '200': { description: Overview, content: { application/json: { schema: { $ref: '#/components/schemas/AccountOverview' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/trading/accounts/{accountId}/risk-events:
    get:
      tags: [Trading]
      summary: Risk and breach history of the account (newest first)
      description: Audit-safe evidence of every risk decision (breach, forced close, pass). Page with `before` = `nextBefore` of the previous page.
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters:
        - { $ref: '#/components/parameters/AccountIdParam' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: before, in: query, description: createdAt of the last item of the previous page., schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Page of risk events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RiskEvent' } }
                  nextBefore: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/trading/accounts/{accountId}/breach-review:
    post:
      tags: [Risk review]
      summary: Request a technical breach review (within 72 hours of the breach)
      description: |
        For inaccurate market data, a proven outage, a duplicate fill, a software fault or a wrong risk calculation. It is not a way to reverse a legitimate loss-limit violation.
        One request per breach. After the deadline the call fails with 422 `REVIEW_WINDOW_CLOSED` (the response shows `deadlineAt`).
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '201': { description: Review opened, content: { application/json: { schema: { $ref: '#/components/schemas/BreachReview' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A review was already requested for this breach., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: '`NO_BREACH` or `REVIEW_WINDOW_CLOSED`.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [Risk review]
      summary: State of the review of the latest breach
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
      responses:
        '200':
          description: Latest breach with its deadline and review (null when the account never breached)
          content:
            application/json:
              schema:
                type: object
                nullable: true
                properties:
                  breachEventId: { type: string, format: uuid }
                  breachedAt: { type: string, format: date-time }
                  deadlineAt: { type: string, format: date-time }
                  review: { allOf: [{ $ref: '#/components/schemas/BreachReview' }], nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/plans/{id}:
    patch:
      tags: [Risk review]
      summary: Edit a plan (rule changes create a new rule version)
      description: |
        Price, name and the active flag are edited in place. A change of a rule value (size, target, daily loss, drawdown, leverage, exposure multiple, minimum trading days) on a plan that
        accounts or purchases already use creates a NEW plan row (`ruleVersion` + 1) and deactivates the old one, so existing accounts keep their purchase-time rules.
      security: [{ adminCookie: [] }]
      x-rbac: section:plans:manage
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: The updated plan, or the new version. `versioned` is true when a new row was created (`previousPlanId` = the old row).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  versioned: { type: boolean }
                  previousPlanId: { type: string, format: uuid, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/risk/abuse-flags:
    get:
      tags: [Risk review]
      summary: Abuse flags (cross-account hedging, copy trading, latency abuse)
      security: [{ adminCookie: [] }]
      x-rbac: section:risk:view
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, CONFIRMED, DISMISSED] } }
        - { name: type, in: query, schema: { type: string, enum: [CROSS_ACCOUNT_HEDGE, COPY_TRADING, LATENCY_ABUSE] } }
        - { name: accountId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Page of flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AbuseFlag' } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/risk/abuse-flags/{id}/resolve:
    post:
      tags: [Risk review]
      summary: Confirm or dismiss an abuse flag
      description: Records the decision only. Acting on a confirmed flag (lock the account, void trades) is a separate audited admin action.
      security: [{ adminCookie: [] }]
      x-rbac: section:risk:manage + right:risk.review
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              properties:
                decision: { type: string, enum: [CONFIRMED, DISMISSED] }
                note: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200': { description: Resolved flag, content: { application/json: { schema: { $ref: '#/components/schemas/AbuseFlag' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The flag was already resolved., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/admin/risk/abuse-scan:
    post:
      tags: [Risk review]
      summary: Run the abuse scan now (it also runs every 5 minutes)
      security: [{ adminCookie: [] }]
      x-rbac: section:risk:manage + right:risk.review
      responses:
        '200':
          description: Number of NEW flags per detector
          content:
            application/json:
              schema:
                type: object
                properties:
                  hedge: { type: integer }
                  copyTrading: { type: integer }
                  latency: { type: integer }
                  skipped: { type: boolean, description: True when the scan is switched off in the settings. }
  /api/v1/admin/risk/breach-reviews:
    get:
      tags: [Risk review]
      summary: Technical breach reviews (oldest first)
      security: [{ adminCookie: [] }]
      x-rbac: section:risk:view
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, APPROVED, REJECTED] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Page of reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BreachReview' } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/risk/breach-reviews/{id}/resolve:
    post:
      tags: [Risk review]
      summary: Approve or reject a technical breach review
      description: Records the decision. The original breach event is never erased; an approved correction is a separate authorized compensating ledger action.
      security: [{ adminCookie: [] }]
      x-rbac: section:risk:manage + right:risk.review
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
                note: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200': { description: Resolved review, content: { application/json: { schema: { $ref: '#/components/schemas/BreachReview' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The review was already resolved., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/trading/accounts/{accountId}/risk:
    get:
      tags: [Trading]
      summary: Live risk view (equity, daily / static floors and room, profit target progress, exposure, margin, trading results)
      description: |
        Server-computed. Breach rule: equity <= max(daily floor, static floor). The profit target is judged on the NET balance after the exit fees.
        Poll it or use the `/ws/account` stream for the live overview.
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
      responses:
        '200': { description: Risk status, content: { application/json: { schema: { $ref: '#/components/schemas/RiskStatus' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/trading/accounts/{accountId}/orders/preview:
    post:
      tags: [Trading]
      summary: Order ticket preview (size, notional, margin, fee, maker / taker, maximum valid size)
      description: |
        Read-only. Returns what the engine would decide for this order right now, including the FIRST binding limit (`binding`) and the largest valid
        notional (`maxNotionalUsd`). Nothing is reserved, filled or written. Uses the live mark and the live account state.
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderPreviewRequest' }
            examples:
              byValue: { value: { symbol: BTC, side: BUY, type: MARKET, notionalUsd: '10000', leverage: 10 } }
              byMargin: { value: { symbol: ETH, side: SELL, type: LIMIT, marginUsd: '500', leverage: 5, limitPrice: '3200.5' } }
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPreview' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/trading/accounts/{accountId}/orders:
    parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
    post:
      tags: [Trading]
      summary: Place an order (market, limit, stop, take profit, stop loss)
      description: |
        Idempotent: an `Idempotency-Key` header (1 to 64 chars) or `clientOrderId` in the body is REQUIRED (HTTP 400 `IDEMPOTENCY_KEY_REQUIRED` without one). A replay returns HTTP 200
        with `duplicate: true` and the original order and fills, even when the account was locked in the meantime; a new order returns 201. Limited to 30 writes per second per user.
        An opening order is rejected with `WOULD_BREACH` when its entry fee would take the equity to the daily / static loss floor.
        Execution follows the spec: the server mark is the fill price (see PlaceOrderRequest). Fills are posted through the ledger (`REALIZED_PNL`, `FEE`)
        and risk rules are re-checked right after a trade.
        Limits: 50 pending opening orders, 20 open positions (one net position per symbol), 10 exit orders per position, minimum order value and lot / tick grid,
        gross exposure <= plan multiple x current equity (10x, Instant 3x), single opening entry <= 10 % of the median visible depth (`LIQUIDITY_GUARD`),
        at most 5 exposure-increasing requests per second and 120 per minute per account (HTTP 429 `ORDER_RATE_LIMIT`, reduce-only exits are exempt).
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: 'Required unless `clientOrderId` is sent in the body.', schema: { type: string, minLength: 1, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
            examples:
              market: { value: { symbol: BTC, side: BUY, type: MARKET, size: '0.01', leverage: 3 } }
              limit: { value: { symbol: ETH, side: SELL, type: LIMIT, size: '0.5', limitPrice: '3200.5', expiry: 1h, postOnly: true } }
              stopLoss: { value: { symbol: BTC, side: SELL, type: STOP_LOSS, triggerPrice: '60000', closePosition: true } }
      responses:
        '200': { description: Duplicate request (already processed), content: { application/json: { schema: { $ref: '#/components/schemas/PlaceOrderResult' } } } }
        '201': { description: Order accepted, content: { application/json: { schema: { $ref: '#/components/schemas/PlaceOrderResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Trading]
      summary: List orders (newest first)
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters:
        - { name: active, in: query, description: 'true = only working orders (NEW / PARTIALLY_FILLED).', schema: { type: string, enum: ['true', 'false'] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Orders, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Trading]
      summary: Cancel all working orders (entries and exits)
      description: Optionally only one symbol and/or side. Does not close positions.
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters:
        - { name: symbol, in: query, schema: { type: string, maxLength: 20 } }
        - { name: side, in: query, schema: { $ref: '#/components/schemas/OrderSide' } }
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { type: object, properties: { canceled: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/trading/accounts/{accountId}/orders/{orderId}:
    parameters:
      - { $ref: '#/components/parameters/AccountIdParam' }
      - { $ref: '#/components/parameters/OrderIdParam' }
    get:
      tags: [Trading]
      summary: One order with its fills
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Order'
                  - type: object
                    properties:
                      fills: { type: array, items: { $ref: '#/components/schemas/Fill' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Trading]
      summary: Modify price / trigger / size
      description: The replacement is fully validated first, then the old order is cancelled in the same transaction (returns the new order).
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModifyOrderRequest' }
      responses:
        '200': { description: Replacement order, content: { application/json: { schema: { $ref: '#/components/schemas/PlaceOrderResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Trading]
      summary: Cancel one order (idempotent)
      description: Works even while prices are stale. Releases the reserved margin.
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      responses:
        '200': { description: Cancelled order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/trading/accounts/{accountId}/positions/{symbol}/close:
    post:
      tags: [Trading]
      summary: Close a position (whole, or `size` for a partial close)
      description: |
        Reduce-only market order at the fresh server mark (taker fee, no slippage). A partial close that would leave less than the minimum order value is
        rejected (`RESIDUAL_BELOW_MIN`): close the whole position instead.
        Send an optional `Idempotency-Key` so a retried close returns the first result instead of closing twice.
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters:
        - { $ref: '#/components/parameters/AccountIdParam' }
        - { $ref: '#/components/parameters/SymbolParam' }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 64 } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClosePositionRequest' }
      responses:
        '200': { description: Close result, content: { application/json: { schema: { $ref: '#/components/schemas/PlaceOrderResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No open position in this market., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/trading/accounts/{accountId}/positions/close-all:
    post:
      tags: [Trading]
      summary: Close all positions (or only longs / only shorts)
      description: Each market is closed in its own transaction. Per-market errors are returned in `results[].error`, nothing is reported closed unless it was.
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { side: { $ref: '#/components/schemas/PositionSide' } } }
      responses:
        '200': { description: Per-market results, content: { application/json: { schema: { $ref: '#/components/schemas/CloseAllResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/trading/accounts/{accountId}/position-mode:
    put:
      tags: [Trading]
      summary: Set the position mode (ONE_WAY only)
      description: Spec v1 has one net position per symbol. `ONE_WAY` is accepted, `HEDGE` is refused with `HEDGE_NOT_AVAILABLE`.
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [mode], properties: { mode: { $ref: '#/components/schemas/PositionMode' } } }
      responses:
        '200': { description: Mode set, content: { application/json: { schema: { type: object, properties: { positionMode: { $ref: '#/components/schemas/PositionMode' } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/trading/accounts/{accountId}/fills:
    get:
      tags: [Trading]
      summary: Fill history (latest 50)
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
      responses:
        '200': { description: Fills, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Fill' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/trading/accounts/{accountId}/ledger:
    get:
      tags: [Trading]
      summary: Ledger (realized PnL, fees, funding, adjustments; latest 100)
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
      responses:
        '200': { description: Ledger entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------ Admin markets
  /api/v1/admin/markets:
    get:
      tags: [Admin markets]
      summary: Market registry (all markets, including disabled)
      security: [{ adminCookie: [] }]
      x-rbac: section:markets:view
      responses:
        '200': { description: Markets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminMarket' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/markets/sync:
    post:
      tags: [Admin markets]
      summary: Sync the registry from Hyperliquid
      description: |
        Only symbols in `LAUNCH_SYMBOLS` are stored. Runs at startup too. New symbols get the reviewed catalog limits; a symbol without a
        reviewed row is created **disabled**. A delisted contract becomes **close-only**. Admin edits are never overwritten; a lower
        Hyperliquid leverage limit always wins. Writes an audit log entry.
      security: [{ adminCookie: [] }]
      x-rbac: section:markets:manage + right:market.sync
      responses:
        '200': { description: Number of markets synced, content: { application/json: { schema: { type: object, properties: { synced: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/markets/{id}:
    patch:
      tags: [Admin markets]
      summary: Edit a market (enable, halt, close-only, limits, fees)
      description: Any change to limits or fees starts a new `riskTierVersion`, stored on every later fill. The live feed starts/stops tracking the symbol with `isEnabled`. Writes an audit log entry.
      security: [{ adminCookie: [] }]
      x-rbac: section:markets:manage
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMarketUpdate' }
            example: { isCloseOnly: true, maxNotionalUsd: 500000, takerFeeRate: 0.0004 }
      responses:
        '200': { description: Updated market, content: { application/json: { schema: { $ref: '#/components/schemas/AdminMarket' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

