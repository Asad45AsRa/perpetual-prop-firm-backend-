# =====================================================================
# FILE:   backend/docs/openapi-rbac.yaml   (REPLACE the existing file)
# FOLDER: backend/docs/
# LIVE DATA ONLY: every market, price, order book, trade and candle described here is served
# from the live Hyperliquid feed through our backend. There is no mock, fake, sample or
# placeholder data anywhere in this API. Examples below only show the SHAPE of a response.
# =====================================================================
openapi: 3.0.3
info:
  title: Perpetual Prop Firm API - Auth, RBAC, Markets & Trading
  version: 2.2.0
  description: |
    **Scope now: authentication, RBAC, Hyperliquid market data, the trading engine and admin market management.**
    Payments, payouts, affiliate and the other admin feature endpoints are still left out of this file (kept commented
    at the bottom) and will be documented when they are wired.

    ### What is new in 2.2.0 (Terminal market data)
    - **New public routes under `/api/v1/terminal`** for the trading terminal: `bootstrap`, `markets`, `markets/{symbol}`,
      `markets/{symbol}/book` (depth + price grouping), `markets/{symbol}/trades` and `markets/{symbol}/candles`.
    - Everything is LIVE Hyperliquid data kept in memory by the backend: 24h change, 24h volume, open interest, premium,
      funding, public trades and candles. A value is `null` until Hyperliquid has sent it. Nothing is simulated or filled in.
    - The WebSocket `/ws/market` got the channels `trades` and `candles`, per-client book `depth` / `group`, per-channel symbol
      lists and the 24h statistics inside every `price` message.
    - Account data (positions, orders, fills) is unchanged and stays under `/api/v1/trading`.

    ### What is new in 2.1.0 (Hyperliquid + trading engine)
    - **Hyperliquid is used for market data only, and only from our backend.** Browsers never call Hyperliquid:
      they use `GET /api/v1/markets/*` and the `ws://host/ws/market` WebSocket.
    - Live feed: `l2Book` (order book depth) + `activeAssetCtx` (mark, oracle, funding) with REST snapshot on start/reconnect,
      exponential reconnect, ping, silent-socket watchdog, crossed/empty book rejection and REST fallback for the mark price.
    - **Stale prices block trading** (`MARKET_FEED_STALE`): the book must be fresh (`STALE_BOOK_MS`, default 5 s) AND the mark
      price must be fresh (`STALE_MARK_MS`, default 10 s). Cancels still work while stale.
    - **Order engine:** `MARKET` (walks the real book, VWAP), `LIMIT` (GTC / IOC, post-only), `STOP_MARKET`, `TAKE_PROFIT`,
      `STOP_LOSS`, modify, cancel, cancel-all, close position, close-all, idempotent placement (`Idempotency-Key`).
    - **Positions:** cross margin, `ONE_WAY` / `HEDGE` position modes, per-fill margin, PnL and fees posted through the ledger.
    - **Fees:** maker/taker by market group (crypto 0.01 % / 0.04 %, equity 0 / 0.03 %, commodity / index / FX 0 / 0.005 %),
      overridable per market. Fees are rounded up, signed amounts down.
    - **Funding:** hourly (UTC) snapshot of open positions, posted once per position and hour when Hyperliquid publishes the rate.
    - **Admin Markets:** sync from Hyperliquid, close-only, halt, notional limits, per-market fees, risk-tier versioning.
    - New stable trading error codes (HTTP 422) the frontend can map to messages (see "Trading errors").

    Role-based access control for the three frontends: **trader dashboard**, **affiliate dashboard** and **admin panel**.

    ## Who is who
    | Role (DB) | Role (admin API) | Kind | How access works |
    |---|---|---|---|
    | `USER` | - | customer | Access comes from **portals**: `TRADER` (trader dashboard, terminal, challenges, payouts) and/or `AFFILIATE` (affiliate dashboard). Sign-up gives one portal; a trader can also join the affiliate program. Ownership (only *your* accounts/payouts) is enforced in the services. |
    | `MODERATOR` | `moderator` | staff | Per-page access levels + special rights, granted by the super admin. |
    | `ADMIN` | `admin` | staff | Same model as moderator, with a broader default preset. |
    | `SUPER_ADMIN` | `super_admin` | staff | Everything, always. Cannot be changed, suspended or deleted. Only role that can manage staff. |

    The admin endpoints use the lowercase roles (`super_admin` / `admin` / `moderator`), like the admin frontend.

    ## Staff access model (mirrors the admin frontend)
    1. **Page level** per admin page: `none` / `view` / `manage`. `view` = open and read the page. `manage` = also create, edit and run the page's normal actions. `manage` implies `view`.
    2. **Special rights** for sensitive actions (moving money, kill switches...). Granted separately, so `manage` on a page never silently allows them.
    3. Page keys are the admin sidebar page keys (frontend `src/components/admin/pages/*` `key`). The `staff` page is super-admin-only and can never be granted.

    ## Sessions: httpOnly cookies (no tokens in the body)
    | App | Cookies | Sent to |
    |---|---|---|
    | Customer (trader + affiliate) | `pp_at` (access, short-lived) + `pp_rt` (refresh) | `/api/v1/*` |
    | Admin console | `pp_admin_at` + `pp_admin_rt` | `/api/v1/admin/*` only |

    - Call the API with `credentials: "include"`. The two apps' sessions are separate; a staff cookie never signs into the customer app and vice versa.
    - **Silent refresh:** when the access cookie is missing or expired, the refresh cookie is used automatically and rotated. There is no refresh endpoint.
    - **CSRF:** a write (`POST/PUT/PATCH/DELETE`) that carries session cookies must come from an allowed `Origin` (403 otherwise) and be `Content-Type: application/json` (415 otherwise). An empty JSON body is read as `{}`.
    - Force sign-out, suspension, role change, 2FA/password reset and "log out everywhere" end every session at once (the next request returns 401).

    ## Customer sign-in (passwordless)
    1. `POST /auth/email/start` -> a 6-digit code is emailed (valid 10 min). `POST /auth/email/resend` after 60 s.
    2. `POST /auth/email/verify` -> session cookies + `{ user, isNewUser, needsProfile }`. New accounts are created here.
    3. If `needsProfile`, finish onboarding with `PATCH /auth/profile` (username, then avatar).
    4. Or `POST /auth/google` with a Google ID token (same response).

    ## Admin sign-in (password + 2FA, always)
    1. `POST /admin/auth/login` -> `{ challengeId, twoFactorSetupRequired, otpauthUrl? }`. `otpauthUrl` is returned the first time (or after "Reset 2FA"): show it as a QR code.
    2. `POST /admin/auth/verify-2fa` with the 6-digit authenticator code -> admin session cookies + `{ user }`.

    ## Errors
    Every error is `{ code, message, requestId, details? }`; `requestId` also comes back in the `x-request-id` header.
    - `400` `BAD_REQUEST` (validation, `details` has field errors) / `BAD_CODE` (wrong email code).
    - `401` `UNAUTHORIZED` - not signed in, session ended, or account disabled. Admin: `BAD_CREDENTIALS`, `BAD_CODE`.
    - `403` `FORBIDDEN` - signed in but not allowed. The `message` says exactly what is missing, e.g. `Requires "manage" access to the "payouts" section`. `PROTECTED` when acting on the super admin.
    - `409` `CONFLICT` / `VERSION_CONFLICT` / `SELF_ACTION` / `SELF_DELETE`.
    - `429` `RATE_LIMITED` / `RESEND_COOLDOWN` (`details.retryInSeconds`) / `TOO_MANY_ATTEMPTS`.

    ### Trading errors (HTTP 422, same `{ code, message, requestId, details? }` shape)
    `MARKET_FEED_STALE`, `MARKET_DISABLED`, `MARKET_CLOSE_ONLY`, `TRADING_PAUSED`, `ACCOUNT_NOT_ACTIVE`, `INVALID_ORDER`, `INVALID_LOT`,
    `INVALID_TICK`, `BELOW_MIN_NOTIONAL`, `LEVERAGE_CAP`, `INVALID_SLIPPAGE`, `VISIBLE_BOOK_TOO_THIN`, `OPEN_SLIPPAGE_EXCEEDED`,
    `POST_ONLY_WOULD_TAKE`, `TRIGGER_WOULD_FIRE`, `POSITION_SIDE_REQUIRED`, `INVALID_POSITION_SIDE`, `NO_POSITION`, `REDUCE_ONLY`,
    `REDUCE_ONLY_EXCESS`, `EXIT_LEG_LIMIT`, `EXIT_SIZE_EXCEEDS_POSITION`, `OPEN_ORDER_LIMIT`, `OPEN_POSITION_LIMIT`, `POSITION_CAP`,
    `GROSS_EXPOSURE_CAP`, `INSUFFICIENT_MARGIN`, `POSITION_MODE_LOCKED`, `ORDER_ALREADY_FILLED`, `ORDER_NOT_ACTIVE`, and `NO_PRICE`
    (no price/book received yet for a market).

    ## Market data WebSocket
    `ws://host/ws/market` (no cookie needed, public data). Updates are coalesced per symbol (`WS_PUSH_INTERVAL_MS`, default 250 ms).
    Channels: `price` (default, every symbol), `book`, `trades`, `candles`.
    - Server to client:
      - `hello` `{symbols, intervalMs, channels, candleIntervals}`
      - `price` `{symbol, price, bid, ask, mark, oracle, fundingRate, bookFresh, markFresh, fresh, ts, prevDayPx, change24h, change24hPct,
        volume24hUsd, openInterest, openInterestUsd, premium, nextFundingAt}`
      - `book` `{symbol, bids, asks, seq, ts, depth, group}` (full snapshot, only if subscribed; rows are `[price, size]`)
      - `trades` `{symbol, snapshot, trades:[{price, size, side, time, tid}]}` newest first. `snapshot: true` is the recent history
        sent right after subscribing, later messages contain new trades only.
      - `candle` `{symbol, interval, t, T, o, h, l, c, v, n}`. The same `t` updates the forming candle, a new `t` is a new candle.
      - `feed` `{symbol, fresh, bookFresh, markFresh}` (sent only when freshness changes)
      - `error` `{code}` with `INVALID_JSON`, `SYMBOL_REQUIRED`, `INVALID_INTERVAL`, `UNKNOWN_SYMBOL`, `TOO_MANY_CANDLE_STREAMS`
        (max 6 candle streams per connection)
      - `pong`
    - Client to server:
      - `{"op":"subscribe","channels":["book","trades"],"symbols":["BTC"],"depth":15,"group":"1"}`
        (`depth` 1-20, `group` = price step, empty string = raw levels)
      - `{"op":"subscribe","channels":["candles"],"symbols":["BTC"],"interval":"1h"}` (`candles` needs `symbols` and `interval`)
      - `{"op":"unsubscribe","channels":["book","trades"]}` switches the channels off and clears their symbol lists
      - `{"op":"unsubscribe","channels":["candles"],"symbols":["BTC"],"interval":"1h"}`
      - `{"op":"ping"}`
    - The symbol list of a message applies only to the channels named in that message (to `price`, `book` and `trades` when no channel
      is named). A terminal therefore keeps `price` for every market (markets table) and asks `book` + `trades` for the selected market only.
    - Live candle streams are opened on Hyperliquid only while a browser needs them and are released when the socket closes.

    ## Guards
    Each operation shows its guard in `x-rbac`: `public`, `customer`, `staff`, `super_admin`,
    `portal:<TRADER|AFFILIATE>` (+ `ownership` = only your own trading account) or `section:<key>:<level>` + `right:<key>`.
servers:
  - url: http://localhost:4000
    description: Local
tags:
  - name: Auth (customer)
    description: Trader + affiliate sign-in with an email code or Google, onboarding profile, active devices.
  - name: Auth (admin)
    description: Admin console sign-in with password + 2FA.
  - name: RBAC
    description: Effective access and the permission catalog.
  - name: Staff & permissions
    description: Super admin only. Matches the admin "Staff & Permissions" page.
  - name: Portals
    description: Trader / affiliate dashboard access for customers.
  - name: Markets
    description: Public Hyperliquid-backed market data (prices, order book, feed health). Served by our backend only.
  - name: Terminal
    description: Public live market data for the trading terminal (markets table, market bar, order book with grouping, trades, candles). Served by our backend only.
  - name: Trading
    description: Trader terminal. Orders, positions and account history. Portal `TRADER` + ownership of the account.
  - name: Admin markets
    description: Market registry (sync from Hyperliquid, limits, fees, close-only, halt). Admin page `markets`.
  # - name: Route matrix   (commented for now: other non auth/RBAC routes)

components:
  securitySchemes:
    customerCookie:
      type: apiKey
      in: cookie
      name: pp_at
      description: Customer session (set by `/auth/email/verify` or `/auth/google`). Renewed silently from `pp_rt`.
    adminCookie:
      type: apiKey
      in: cookie
      name: pp_admin_at
      description: Admin session (set by `/admin/auth/verify-2fa`). Renewed silently from `pp_admin_rt`.
  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: BAD_REQUEST, message: Validation failed, requestId: 3f0c..., details: { fieldErrors: { email: [Invalid email] } } }
    Unauthorized:
      description: Not signed in, session ended (signed out elsewhere, forced out, suspended) or account disabled.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: UNAUTHORIZED, message: Please sign in, requestId: 3f0c... }
    Forbidden:
      description: Signed in but lacking the required role, portal, page level or special right.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            section: { value: { code: FORBIDDEN, message: 'Requires "manage" access to the "payouts" section', requestId: 3f0c... } }
            right: { value: { code: FORBIDDEN, message: 'Requires the special right: payout.approve', requestId: 3f0c... } }
            portal: { value: { code: FORBIDDEN, message: Join the affiliate program to use the affiliate dashboard, requestId: 3f0c... } }
            protected: { value: { code: PROTECTED, message: The super admin cannot be changed., requestId: 3f0c... } }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: RATE_LIMITED, message: Too many requests, requestId: 3f0c... }
    Unprocessable:
      description: A trading rule rejected the request (see "Trading errors" in the description for every `code`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            stale: { value: { code: MARKET_FEED_STALE, message: Live price is stale. Trading is paused for this market., requestId: 3f0c... } }
            margin: { value: { code: INSUFFICIENT_MARGIN, message: Not enough available margin, requestId: 3f0c... } }
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountIdParam:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderIdParam:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SymbolParam:
      name: symbol
      in: path
      required: true
      description: Case-insensitive (BTC, ETH, ...).
      schema: { type: string }
  schemas:
    Error:
      type: object
      description: Every error uses this shape. `requestId` equals the `x-request-id` response header.
      required: [code, message, requestId]
      properties:
        code: { type: string, example: FORBIDDEN }
        message: { type: string, description: Safe to show to the user. }
        requestId: { type: string }
        details: { description: 'Field errors, or e.g. `{ retryInSeconds }`.' }
    Ok:
      type: object
      properties:
        ok: { type: boolean, example: true }
    Role:
      type: string
      description: Database role, used in `EffectiveAccess`.
      enum: [USER, MODERATOR, ADMIN, SUPER_ADMIN]
    AdminRole:
      type: string
      description: Role as the admin frontend uses it.
      enum: [super_admin, admin, moderator]
    StaffRoleEditable:
      type: string
      enum: [admin, moderator]
      description: There can only be one super admin.
    Portal:
      type: string
      enum: [TRADER, AFFILIATE]
    Platform:
      type: string
      enum: [Instagram, Meta, TikTok]
      description: Affiliate sign-up "where do you post" platform.
    AccessLevel:
      type: string
      enum: [none, view, manage]
    AdminSection:
      type: string
      description: Admin sidebar page key. `staff` is super-admin-only.
      enum:
        [overview, operations, reports, metrics, traders, accounts, activity, risk, markets, issuance, kyc, ledger,
         trader-view, demo, leaderboard, plans, payments, payouts, approvals, affiliates, affiliate-payouts, coupons,
         reserves, public-payouts, tickets, announcements, emails, cms, competitions, health, errors, webhooks, jobs,
         alerts, audit-logs, settings, staff]
    SpecialRight:
      type: string
      enum:
        [finance.view, traders.suspend, risk.review, tickets.reply, kyc.review, payout.approve, approvals.decide,
         account.override, refund.issue, market.sync, settings.edit, settings.kill_switch, audit.export]
    PortalPermission:
      type: string
      enum:
        [trader.dashboard.view, trader.accounts.view, trader.trade, trader.challenges.purchase, trader.demo.start,
         trader.payouts.request, trader.payouts.view, trader.purchases.view, trader.leaderboard.view,
         trader.profile.manage, affiliate.dashboard.view, affiliate.referrals.view, affiliate.referral_link.manage,
         affiliate.commissions.view, affiliate.payouts.request, affiliate.payouts.view, affiliate.giveaways.view,
         affiliate.certificates.view, affiliate.profile.manage]
    SectionLevels:
      type: object
      description: Level for every admin page (`none` when not granted).
      additionalProperties: { $ref: '#/components/schemas/AccessLevel' }
      example: { overview: view, payouts: manage, settings: none }
    Grants:
      type: object
      description: Page -> level. Pages not listed are `none`. `staff` is rejected (super-admin-only).
      additionalProperties:
        type: string
        enum: [none, view, manage]
      example: { overview: view, traders: manage, payouts: manage, settings: view }
    EffectiveAccess:
      type: object
      required: [role, kind, isSuperAdmin, portals, permissions, sections, rights]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        kind: { type: string, enum: [user, staff] }
        isSuperAdmin: { type: boolean }
        portals:
          type: array
          items: { $ref: '#/components/schemas/Portal' }
          description: Customer dashboards (always empty for staff).
        permissions:
          type: array
          items: { $ref: '#/components/schemas/PortalPermission' }
          description: Customer features unlocked by the portals (empty for staff).
        sections: { $ref: '#/components/schemas/SectionLevels' }
        rights:
          type: array
          items: { $ref: '#/components/schemas/SpecialRight' }
      example:
        role: USER
        kind: user
        isSuperAdmin: false
        portals: [TRADER]
        permissions: [trader.dashboard.view, trader.accounts.view, trader.trade]
        sections: {}
        rights: []
    CustomerUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string, nullable: true }
        avatar: { type: string, nullable: true, example: /images/avatars/avatar-3.png }
        leaderboardPublic: { type: boolean }
        portals: { type: array, items: { $ref: '#/components/schemas/Portal' } }
        referralCode: { type: string }
        signupPlatform: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/Platform' }] }
        signupHandle: { type: string, nullable: true, description: Without the leading @. }
        createdAt: { type: string, format: date-time }
    SignInResult:
      type: object
      description: Session cookies are set on this response.
      properties:
        user: { $ref: '#/components/schemas/CustomerUser' }
        isNewUser: { type: boolean }
        needsProfile: { type: boolean, description: 'True until a username and avatar are set (onboarding steps 3 and 4).' }
    CodeSent:
      type: object
      properties:
        ok: { type: boolean, example: true }
        resendInSeconds: { type: integer, example: 60 }
        expiresInSeconds: { type: integer, example: 600 }
    SignupMeta:
      type: object
      properties:
        portal: { allOf: [{ $ref: '#/components/schemas/Portal' }], default: TRADER, description: Which sign-up page the person came from. }
        referralCode: { type: string, description: 'From a referral link (new accounts only).' }
        platform: { allOf: [{ $ref: '#/components/schemas/Platform' }], description: Required when portal is AFFILIATE. }
        handle: { type: string, description: 'Social handle, e.g. @hafiz.trades. Required when portal is AFFILIATE.' }
    DeviceSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        device: { type: string, example: Windows · Chrome }
        ip: { type: string, nullable: true }
        lastActiveAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        current: { type: boolean, description: This browser. }
    AdminUser:
      type: object
      description: The admin frontend's `AdminUser` (the signed-in staff member).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/AdminRole' }
        grants:
          type: object
          description: Only pages above `none`. Empty for the super admin (has everything).
          additionalProperties: { type: string, enum: [view, manage] }
        rights:
          type: array
          items: { $ref: '#/components/schemas/SpecialRight' }
        protected: { type: boolean, description: true only for the super admin }
    StaffMember:
      description: One row of the Staff & Permissions table (frontend `Staff`).
      allOf:
        - $ref: '#/components/schemas/AdminUser'
        - type: object
          properties:
            status: { type: string, enum: [active, suspended] }
            twoFactor: { type: string, enum: [enabled, setup required] }
            lastLoginAt: { type: string, description: 'ISO date, or "" if never.' }
            createdBy: { type: string, description: 'Email of the creator, or "".' }
            createdAt: { type: string, format: date-time }
            version: { type: integer, description: 'Send back as `ifVersion` when editing.' }
    KillSwitches:
      type: object
      properties:
        pauseTrading: { type: boolean }
        pausePurchases: { type: boolean }
        pausePayouts: { type: boolean }
        maintenanceMode: { type: boolean }
    Catalog:
      type: object
      properties:
        levels:
          type: array
          items: { $ref: '#/components/schemas/AccessLevel' }
        sections:
          type: array
          items:
            type: object
            properties:
              key: { $ref: '#/components/schemas/AdminSection' }
              label: { type: string }
              group: { type: string, enum: [Workspace, Traders & trading, Finance & sales, Communication, Platform control] }
              superOnly: { type: boolean }
        rights:
          type: array
          items:
            type: object
            properties:
              key: { $ref: '#/components/schemas/SpecialRight' }
              label: { type: string }
              hint: { type: string }
        portals:
          type: object
          properties:
            TRADER: { type: array, items: { $ref: '#/components/schemas/PortalPermission' } }
            AFFILIATE: { type: array, items: { $ref: '#/components/schemas/PortalPermission' } }
        rolePresets:
          type: object
          description: Default access applied when a staff member is created without explicit grants.
          properties:
            admin: { $ref: '#/components/schemas/Preset' }
            moderator: { $ref: '#/components/schemas/Preset' }
    # ----------------------------------------------- Markets & trading
    Decimal:
      type: string
      pattern: '^\d+(\.\d+)?$'
      description: Decimals travel as strings so no precision is lost in JSON.
      example: '64250.5'
    MarketType:
      type: string
      enum: [CRYPTO, EQUITY, COMMODITY, INDEX, FX]
      description: Decides the fee group and the default leverage cap.
    OrderSide: { type: string, enum: [BUY, SELL] }
    PositionSide: { type: string, enum: [LONG, SHORT] }
    PositionMode:
      type: string
      enum: [ONE_WAY, HEDGE]
      description: ONE_WAY = one net position per market. HEDGE = independent long and short per market (`positionSide` required).
    OrderType: { type: string, enum: [MARKET, LIMIT, STOP_MARKET, TAKE_PROFIT, STOP_LOSS] }
    OrderStatus: { type: string, enum: [NEW, PARTIALLY_FILLED, FILLED, CANCELED, REJECTED] }
    TimeInForce: { type: string, enum: [GTC, IOC] }
    Liquidity: { type: string, enum: [MAKER, TAKER] }
    LedgerType: { type: string, enum: [DEPOSIT, REALIZED_PNL, FEE, FUNDING, PAYOUT, ADJUSTMENT] }
    Market:
      type: object
      description: Public shape of one market with its live data. `tradable` is the single flag the UI needs.
      properties:
        symbol: { type: string, example: BTC }
        marketType: { $ref: '#/components/schemas/MarketType' }
        maxLeverage: { type: integer, example: 10 }
        maxNotionalUsd: { type: string, nullable: true, description: 'Max open notional per symbol and side, per account. null = no per-symbol cap.' }
        minNotionalUsd: { type: string, example: '10' }
        szDecimals: { type: integer }
        pricePrecision: { type: integer }
        priceTick: { type: string, description: 'Prices must be a multiple of this (max 5 significant figures).' }
        sizeStep: { type: string, description: Order size must be a multiple of this. }
        minSize: { type: string }
        isHalted: { type: boolean }
        isCloseOnly: { type: boolean, description: 'Existing positions can be reduced, no new exposure.' }
        fundingSupported: { type: boolean }
        price: { type: string, nullable: true, description: Mid price. }
        bid: { type: string, nullable: true }
        ask: { type: string, nullable: true }
        mark: { type: string, nullable: true }
        oracle: { type: string, nullable: true }
        fundingRate: { type: string, nullable: true }
        bookFresh: { type: boolean }
        markFresh: { type: boolean }
        priceFresh: { type: boolean, description: bookFresh AND markFresh. Trading is blocked while false. }
        tradable: { type: boolean, description: enabled AND not halted AND not close-only AND priceFresh. }
        updatedAt: { type: integer, nullable: true, description: Unix ms of the last tick. }
    PriceTick:
      type: object
      properties:
        symbol: { type: string }
        price: { type: string }
        bid: { type: string, nullable: true }
        ask: { type: string, nullable: true }
        mark: { type: string, nullable: true }
        oracle: { type: string, nullable: true }
        fundingRate: { type: string, nullable: true }
        fresh: { type: boolean }
        bookFresh: { type: boolean }
        markFresh: { type: boolean }
        ts: { type: integer, description: Unix ms. }
    OrderBook:
      type: object
      description: Same data the engine fills against. Levels are `[price, size]`, best first.
      properties:
        symbol: { type: string }
        bids: { type: array, items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 } }
        asks: { type: array, items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 } }
        fresh: { type: boolean }
        seq: { type: integer }
        ts: { type: integer }
    FeedStatus:
      type: object
      properties:
        connected: { type: boolean, description: Hyperliquid socket state. }
        limits:
          type: object
          description: Active staleness limits in milliseconds.
          additionalProperties: true
        symbols:
          type: array
          items: { type: object, additionalProperties: true, description: Per symbol age of book / mark and freshness. }
    CandleInterval:
      type: string
      enum: ['1m', '3m', '5m', '15m', '30m', '1h', '2h', '4h', '8h', '12h', '1d', '3d', '1w', '1M']
    Candle:
      type: object
      description: One OHLCV candle from Hyperliquid. Short keys on purpose (a chart loads thousands of rows).
      properties:
        t: { type: integer, description: 'Open time, Unix ms.' }
        T: { type: integer, description: 'Close time, Unix ms.' }
        o: { type: string }
        h: { type: string }
        l: { type: string }
        c: { type: string }
        v: { type: string, description: Volume in the base asset. }
        n: { type: integer, description: Number of trades in the candle. }
    TerminalMarket:
      description: |
        A market for the terminal: everything of `Market` plus 24h statistics, caps, fee rates and the offered book groups.
        Statistics are `null` until Hyperliquid has sent them.
      allOf:
        - $ref: '#/components/schemas/Market'
        - type: object
          properties:
            positionCapUsd: { type: string, nullable: true, description: Max open notional per symbol and side (same value as `maxNotionalUsd`). }
            makerFeeRate: { type: string, description: 'Rate of notional, 0.0001 = 0.01 %.' }
            takerFeeRate: { type: string }
            bookGroups: { type: array, items: { type: string }, description: 'Price steps the order book can be grouped by, smallest first.' }
            prevDayPx: { type: string, nullable: true, description: Price 24 hours ago. }
            change24h: { type: string, nullable: true, description: Mark (or mid) minus prevDayPx. }
            change24hPct: { type: string, nullable: true, description: 'Percent, 4 decimals.' }
            volume24hUsd: { type: string, nullable: true }
            openInterest: { type: string, nullable: true, description: In base asset units. }
            openInterestUsd: { type: string, nullable: true }
            premium: { type: string, nullable: true }
            nextFundingAt: { type: integer, description: 'Next full UTC hour (Hyperliquid pays funding hourly), Unix ms.' }
    TerminalBook:
      type: object
      description: Rows are `[price, size]`, best first. Grouping rounds bids DOWN and asks UP, so the spread is never made to look tighter.
      properties:
        symbol: { type: string }
        group: { type: string, nullable: true, description: 'Applied price step, null = raw levels.' }
        groups: { type: array, items: { type: string }, description: Price steps to offer in the UI. }
        bids: { type: array, items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 } }
        asks: { type: array, items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 } }
        spread: { type: string, nullable: true, description: Spread of the REAL book (not the grouped one). }
        spreadPct: { type: string, nullable: true }
        fresh: { type: boolean }
        seq: { type: integer }
        ts: { type: integer }
    TerminalTrade:
      type: object
      properties:
        price: { type: string }
        size: { type: string }
        side: { type: string, enum: [BUY, SELL], description: Side of the aggressor (taker). }
        time: { type: integer, description: 'Exchange time, Unix ms.' }
        tid: { type: string, description: Trade id. }
    TerminalTrades:
      type: object
      properties:
        symbol: { type: string }
        trades: { type: array, items: { $ref: '#/components/schemas/TerminalTrade' }, description: Newest first. }
        ts: { type: integer }
    TerminalCandles:
      type: object
      properties:
        symbol: { type: string }
        interval: { $ref: '#/components/schemas/CandleInterval' }
        candles: { type: array, items: { $ref: '#/components/schemas/Candle' }, description: Oldest first. }
        ts: { type: integer }
    TerminalBootstrap:
      type: object
      description: Everything the terminal needs for its first paint in one response.
      properties:
        serverTime: { type: integer }
        selectedSymbol: { type: string }
        markets: { type: array, items: { $ref: '#/components/schemas/TerminalMarket' } }
        book: { type: object, allOf: [{ $ref: '#/components/schemas/TerminalBook' }], nullable: true, description: null until the first book has arrived. }
        trades: { type: array, items: { $ref: '#/components/schemas/TerminalTrade' } }
        chart:
          type: object
          properties:
            intervals: { type: array, items: { $ref: '#/components/schemas/CandleInterval' } }
            defaultInterval: { $ref: '#/components/schemas/CandleInterval' }
        ws:
          type: object
          properties:
            path: { type: string, example: /ws/market }
            channels: { type: array, items: { type: string } }
    PlaceOrderRequest:
      type: object
      required: [symbol, side]
      description: |
        | type | needs |
        |---|---|
        | `MARKET` (default) | `size`. Opening/adding/reversing needs the FULL size within the visible book and within `maxSlippagePct` (default 3 %). Closing orders may fill partly and have no slippage cap. |
        | `LIMIT` | `size`, `limitPrice`. Crossing fills as taker (never above the limit), the rest rests (`GTC`) or is cancelled (`IOC`). Resting fills are maker at the limit price. `postOnly` rejects instead of taking. |
        | `STOP_MARKET` | `size`, `triggerPrice`. Entry stop, reserves nothing; margin and caps are re-checked when it fires. |
        | `TAKE_PROFIT` / `STOP_LOSS` | `triggerPrice` + `size` or `closePosition: true`. Reduce-only. Fires when the mark OR the executable side of the book touches the level. |
      properties:
        symbol: { type: string, minLength: 1, maxLength: 20, example: BTC }
        side: { $ref: '#/components/schemas/OrderSide' }
        type: { allOf: [{ $ref: '#/components/schemas/OrderType' }], default: MARKET }
        size: { $ref: '#/components/schemas/Decimal' }
        closePosition: { type: boolean, default: false, description: 'TP / SL that always closes the whole position (size follows the position).' }
        limitPrice: { $ref: '#/components/schemas/Decimal' }
        triggerPrice: { $ref: '#/components/schemas/Decimal' }
        leverage: { type: integer, minimum: 1, maximum: 200, default: 1, description: 'Per order. Effective max = min(market, plan).' }
        reduceOnly: { type: boolean, default: false }
        postOnly: { type: boolean, default: false }
        timeInForce: { allOf: [{ $ref: '#/components/schemas/TimeInForce' }], default: GTC }
        positionSide: { $ref: '#/components/schemas/PositionSide' }
        maxSlippagePct: { $ref: '#/components/schemas/Decimal' }
        clientOrderId: { type: string, minLength: 1, maxLength: 64, description: 'Same as the `Idempotency-Key` header.' }
    ModifyOrderRequest:
      type: object
      description: Send at least one field. The replacement is validated first, then the old order is cancelled in the same transaction.
      minProperties: 1
      properties:
        size: { $ref: '#/components/schemas/Decimal' }
        limitPrice: { $ref: '#/components/schemas/Decimal' }
        triggerPrice: { $ref: '#/components/schemas/Decimal' }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        symbol: { type: string, description: 'Present on list / detail responses (market.symbol).' }
        side: { $ref: '#/components/schemas/OrderSide' }
        type: { $ref: '#/components/schemas/OrderType' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        size: { type: string }
        limitPrice: { type: string, nullable: true }
        triggerPrice: { type: string, nullable: true }
        leverage: { type: integer }
        reduceOnly: { type: boolean }
        postOnly: { type: boolean }
        timeInForce: { $ref: '#/components/schemas/TimeInForce' }
        positionSide: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/PositionSide' }] }
        closePosition: { type: boolean }
        maxSlippagePct: { type: string, nullable: true }
        reservedMargin: { type: string, description: Margin + fee buffer held for the unfilled part of a resting opening order. }
        triggeredAt: { type: string, format: date-time, nullable: true }
        cancelReason: { type: string, nullable: true, example: USER_CANCEL_ALL }
        clientOrderId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Fill:
      type: object
      description: Every fill stores liquidity, fee rate, the book levels consumed, book time and the rules version (dispute proof).
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        symbol: { type: string }
        side: { $ref: '#/components/schemas/OrderSide' }
        positionSide: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/PositionSide' }] }
        size: { type: string }
        price: { type: string }
        fee: { type: string }
        feeRate: { type: string }
        liquidity: { $ref: '#/components/schemas/Liquidity' }
        realizedPnl: { type: string }
        bookLevels: { type: array, nullable: true, items: { type: array, items: { type: string } }, description: 'Consumed levels `[[price, size], ...]`.' }
        bookTime: { type: string, format: date-time, nullable: true }
        rulesVersion: { type: string, nullable: true, example: engine-1.0 }
        createdAt: { type: string, format: date-time }
    PlaceOrderResult:
      type: object
      properties:
        order: { $ref: '#/components/schemas/Order' }
        fills: { type: array, items: { $ref: '#/components/schemas/Fill' } }
        fill: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/Fill' }], description: 'First fill, or null.' }
        duplicate: { type: boolean, description: 'true when the same Idempotency-Key / clientOrderId was already processed (HTTP 200).' }
    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/LedgerType' }
        amount: { type: string, description: Signed. Positive credits the account. }
        balanceAfter: { type: string }
        refType: { type: string, nullable: true }
        refId: { type: string, nullable: true }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    PositionView:
      type: object
      properties:
        id: { type: string, format: uuid }
        symbol: { type: string }
        side: { $ref: '#/components/schemas/PositionSide' }
        size: { type: string }
        entryPrice: { type: string }
        markPrice: { type: string }
        notional: { type: string }
        leverage: { type: integer }
        margin: { type: string, description: 'Initial margin (notional / leverage per opening fill).' }
        maintenanceMarginRef: { type: string, description: 'Reference only (IM / 2), never liquidates.' }
        unrealizedPnl: { type: string }
        liquidationPrice: { type: string, nullable: true, description: 'Always null (cross margin, no per-position liquidation price).' }
    AccountOverview:
      type: object
      description: 'Cross margin. `equity = balance + unrealizedPnl`; `availableMargin = equity - marginUsed - reservedMargin`.'
      properties:
        id: { type: string, format: uuid }
        stage: { type: string, enum: [CHALLENGE, FUNDED] }
        status: { type: string, enum: [ACTIVE, PASSED, BREACHED, DISABLED] }
        positionMode: { $ref: '#/components/schemas/PositionMode' }
        startingBalance: { type: string }
        balance: { type: string }
        unrealizedPnl: { type: string }
        equity: { type: string }
        marginUsed: { type: string }
        reservedMargin: { type: string, description: Margin reserved by working orders. }
        freeMargin: { type: string }
        availableMargin: { type: string }
        maintenanceMarginRef: { type: string }
        grossExposure: { type: string }
        grossExposureLimit: { type: string, description: 'grossExposureMultiple (default 10) x equity.' }
        overCap: { type: boolean, description: 'Above the cap: new exposure is blocked, reducing is allowed (GROSS_EXPOSURE_CAP).' }
        positions: { type: array, items: { $ref: '#/components/schemas/PositionView' } }
    ClosePositionRequest:
      type: object
      properties:
        size: { $ref: '#/components/schemas/Decimal' }
        positionSide: { $ref: '#/components/schemas/PositionSide' }
    CloseAllResult:
      type: object
      description: Each market is its own transaction, so a thin book on one market never blocks the others.
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              side: { $ref: '#/components/schemas/PositionSide' }
              closed: { type: string }
              remaining: { type: string }
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
    AdminMarket:
      type: object
      description: Full market row as stored (admin view).
      properties:
        id: { type: string, format: uuid }
        symbol: { type: string }
        baseAsset: { type: string }
        hlKey: { type: string, description: 'Exact Hyperliquid coin key (HIP-3 prefixes are kept).' }
        marketType: { $ref: '#/components/schemas/MarketType' }
        szDecimals: { type: integer }
        pricePrecision: { type: integer }
        priceTick: { type: string }
        sizeStep: { type: string }
        minSize: { type: string }
        minNotionalUsd: { type: string }
        maxNotionalUsd: { type: string, nullable: true }
        maxLeverage: { type: integer }
        makerFeeRate: { type: string, nullable: true }
        takerFeeRate: { type: string, nullable: true }
        requireMarkConfirm: { type: boolean }
        fundingSupported: { type: boolean }
        isEnabled: { type: boolean }
        isHalted: { type: boolean }
        isCloseOnly: { type: boolean }
        delistedAt: { type: string, format: date-time, nullable: true }
        riskTierVersion: { type: string, description: Bumped on every limit / fee change and stored on every later fill. }
    AdminMarketUpdate:
      type: object
      description: Send only what changes. Any key except `isEnabled` / `isHalted` starts a new `riskTierVersion`.
      properties:
        isEnabled: { type: boolean }
        isHalted: { type: boolean }
        isCloseOnly: { type: boolean }
        maxLeverage: { type: integer, minimum: 1, maximum: 200 }
        maxNotionalUsd: { type: number, exclusiveMinimum: true, minimum: 0, nullable: true, description: null removes the per-symbol cap. }
        minNotionalUsd: { type: number, minimum: 0 }
        makerFeeRate: { type: number, minimum: 0, maximum: 0.1, nullable: true, description: 'Rate of notional, 0.0004 = 0.04 %. null = use the fee group.' }
        takerFeeRate: { type: number, minimum: 0, maximum: 0.1, nullable: true }
        requireMarkConfirm: { type: boolean }
        fundingSupported: { type: boolean }
        marketType: { $ref: '#/components/schemas/MarketType' }
    Preset:
      type: object
      properties:
        grants: { $ref: '#/components/schemas/Grants' }
        rights:
          type: array
          items: { $ref: '#/components/schemas/SpecialRight' }

paths:
  # ------------------------------------------------------- Auth (customer)
  /api/v1/auth/email/start:
    post:
      tags: [Auth (customer)]
      summary: Send a 6-digit sign-in code (sign in or sign up)
      description: |
        Same response whether or not the email has an account (no account enumeration). Staff emails never get a code.
        For a new account, `portal` / `referralCode` / `platform` / `handle` are kept with the code and used on verify.
      x-rbac: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [email]
                  properties:
                    email: { type: string, format: email }
                - $ref: '#/components/schemas/SignupMeta'
            examples:
              trader: { value: { email: trader@example.com, portal: TRADER } }
              affiliate: { value: { email: hafiz@example.com, portal: AFFILIATE, platform: Instagram, handle: '@hafiz.trades' } }
      responses:
        '200': { description: Code sent, content: { application/json: { schema: { $ref: '#/components/schemas/CodeSent' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { description: 'RESEND_COOLDOWN (`details.retryInSeconds`) or RATE_LIMITED (5/min).', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/auth/email/resend:
    post:
      tags: [Auth (customer)]
      summary: Send a new code (60 s cooldown)
      x-rbac: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '200': { description: Code sent, content: { application/json: { schema: { $ref: '#/components/schemas/CodeSent' } } } }
        '429':
          description: Too soon.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: RESEND_COOLDOWN, message: Please wait 42s before requesting a new code, requestId: 3f0c..., details: { retryInSeconds: 42 } }
  /api/v1/auth/email/verify:
    post:
      tags: [Auth (customer)]
      summary: Check the code and sign in (creates the account if new)
      description: Sets the `pp_at` / `pp_rt` cookies. 5 wrong tries end the code (`TOO_MANY_ATTEMPTS`); request a new one.
      x-rbac: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: '^\d{6}$', example: '482913' }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/SignInResult' } } } }
        '400':
          description: Wrong or expired code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: BAD_CODE, message: That code is not correct., requestId: 3f0c... }
        '429': { description: TOO_MANY_ATTEMPTS or RATE_LIMITED (10/min)., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/auth/google:
    post:
      tags: [Auth (customer)]
      summary: Sign in / sign up with Google
      description: Send the Google Identity Services ID token. 503 `GOOGLE_DISABLED` when the server has no `GOOGLE_CLIENT_ID`.
      x-rbac: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [credential]
                  properties:
                    credential: { type: string, description: 'Google ID token (JWT).' }
                - $ref: '#/components/schemas/SignupMeta'
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/SignInResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Google sign-in is not configured., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/auth/username-available:
    get:
      tags: [Auth (customer)]
      summary: Is a username free? (case-insensitive)
      x-rbac: public
      security: []
      parameters:
        - { name: username, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_]{3,20}$' } }
      responses:
        '200':
          description: Availability
          content:
            application/json:
              schema: { type: object, properties: { username: { type: string }, available: { type: boolean } } }
  /api/v1/auth/me:
    get:
      tags: [Auth (customer), RBAC]
      summary: My profile + effective access
      security: [{ customerCookie: [] }]
      x-rbac: customer
      responses:
        '200':
          description: Profile with access
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/CustomerUser' }
                  needsProfile: { type: boolean }
                  access: { $ref: '#/components/schemas/EffectiveAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/profile:
    patch:
      tags: [Auth (customer)]
      summary: Update username / avatar / leaderboard visibility
      description: Onboarding steps 3 (username) and 4 (avatar), and the Settings page visibility toggle. Send only what changes.
      security: [{ customerCookie: [] }]
      x-rbac: customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, pattern: '^[A-Za-z0-9_]{3,20}$' }
                avatar: { type: string, pattern: '^/images/.+\.(png|webp|jpg)$', example: /images/avatars/avatar-3.png }
                leaderboardPublic: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/CustomerUser' }
                  needsProfile: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: That username is taken., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/auth/logout:
    post:
      tags: [Auth (customer)]
      summary: Sign out this browser
      x-rbac: public
      security: []
      responses:
        '200': { description: Cookies cleared, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
  /api/v1/auth/logout-all:
    post:
      tags: [Auth (customer)]
      summary: Sign out on every device
      security: [{ customerCookie: [] }]
      x-rbac: customer
      responses:
        '200': { description: All sessions ended, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/sessions:
    get:
      tags: [Auth (customer)]
      summary: Active devices
      security: [{ customerCookie: [] }]
      x-rbac: customer
      responses:
        '200':
          description: Signed-in devices, most recent first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DeviceSession' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/sessions/{id}:
    delete:
      tags: [Auth (customer)]
      summary: Sign out one device
      description: Revoking the current device also clears this browser's cookies.
      security: [{ customerCookie: [] }]
      x-rbac: customer
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200': { description: Revoked, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------- Auth (admin)
  /api/v1/admin/auth/login:
    post:
      tags: [Auth (admin)]
      summary: Step 1 - email + password
      description: |
        Returns a short-lived `challengeId` for step 2. The first time (or after "Reset 2FA") also returns
        `otpauthUrl` to show as a QR code for Google Authenticator / 1Password etc.
        Any failure (wrong password, unknown, suspended, not staff) gives the same 401.
      x-rbac: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Password accepted, 2FA needed
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, twoFactorSetupRequired]
                properties:
                  challengeId: { type: string }
                  twoFactorSetupRequired: { type: boolean }
                  otpauthUrl: { type: string, example: 'otpauth://totp/Perpeye:admin@perpeye.io?secret=...&issuer=Perpeye' }
        '401':
          description: Sign-in failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: BAD_CREDENTIALS, message: Sign-in failed. Check your details or contact the super admin., requestId: 3f0c... }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/auth/verify-2fa:
    post:
      tags: [Auth (admin)]
      summary: Step 2 - authenticator code
      description: Sets the `pp_admin_at` / `pp_admin_rt` cookies. Turns 2FA on if this was the setup sign-in.
      x-rbac: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { type: string }
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { type: object, properties: { user: { $ref: '#/components/schemas/AdminUser' } } }
        '401': { description: 'BAD_CODE, or the challenge expired.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/admin/auth/me:
    get:
      tags: [Auth (admin), RBAC]
      summary: Signed-in staff member + kill switches
      security: [{ adminCookie: [] }]
      x-rbac: staff
      responses:
        '200':
          description: Session user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/AdminUser' }
                  killSwitches: { $ref: '#/components/schemas/KillSwitches' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/auth/logout:
    post:
      tags: [Auth (admin)]
      summary: Sign out of the admin console
      x-rbac: public
      security: []
      responses:
        '200': { description: Cookies cleared, content: { application/json: { schema: { type: object } } } }

  # ------------------------------------------------------------------ RBAC
  /api/v1/rbac/me:
    get:
      tags: [RBAC]
      summary: My effective access (either app)
      description: Use `kind` to pick the app, `portals`/`permissions` for customer menus, `sections`/`rights` for the admin sidebar and buttons.
      security: [{ customerCookie: [] }, { adminCookie: [] }]
      x-rbac: signed in
      responses:
        '200':
          description: Effective access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/rbac/catalog:
    get:
      tags: [RBAC]
      summary: Permission catalog (pages, rights, portals, role presets)
      description: Drives the Staff & Permissions page checkboxes.
      security: [{ adminCookie: [] }]
      x-rbac: staff
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --------------------------------------------------------------- Portals
  /api/v1/affiliates/join:
    post:
      tags: [Portals]
      summary: Existing trader joins the affiliate program
      description: Adds the `AFFILIATE` portal. Idempotent. Refused (403) when an admin manages this customer's portals. No body needed.
      security: [{ customerCookie: [] }]
      x-rbac: customer
      responses:
        '200':
          description: Portals after joining
          content:
            application/json:
              schema:
                type: object
                properties:
                  portals: { type: array, items: { $ref: '#/components/schemas/Portal' } }
                  alreadyJoined: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/rbac/users/{id}/portals:
    put:
      tags: [Portals]
      summary: Set a customer's portals
      description: Grant or revoke the trader / affiliate dashboards for one customer. After this, sign-ups and "join" no longer change them.
      security: [{ adminCookie: [] }]
      x-rbac: section:affiliates:manage
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [portals]
              properties:
                portals: { type: array, items: { $ref: '#/components/schemas/Portal' } }
            example: { portals: [TRADER, AFFILIATE] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  portals: { type: array, items: { $ref: '#/components/schemas/Portal' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------- Staff & permissions
  /api/v1/admin/staff:
    get:
      tags: [Staff & permissions]
      summary: List staff (paged)
      security: [{ adminCookie: [] }]
      x-rbac: super_admin
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: q, in: query, description: Search name or email., schema: { type: string } }
        - { name: facet, in: query, description: 'Comma list of filter values to return: `role,status`.', schema: { type: string } }
      responses:
        '200':
          description: Page of staff
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StaffMember' } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  facets:
                    type: object
                    additionalProperties: { type: array, items: { type: string } }
                    example: { role: [super_admin, admin, moderator], status: [active, suspended] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Staff & permissions]
      summary: Create an admin or moderator
      description: Omit `grants` and `rights` to start from the role preset (see the catalog). They set up 2FA on first sign-in.
      security: [{ adminCookie: [] }]
      x-rbac: super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: Temporary password. }
                role: { $ref: '#/components/schemas/StaffRoleEditable' }
                grants: { $ref: '#/components/schemas/Grants' }
                rights: { type: array, items: { $ref: '#/components/schemas/SpecialRight' } }
            example:
              name: Sara K.
              email: support@perpeye.io
              password: temp-pass1
              role: moderator
              grants: { traders: view, payouts: manage }
              rights: []
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/StaffMember' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A staff member with this email already exists., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/admin/staff/{id}:
    parameters: [{ $ref: '#/components/parameters/IdParam' }]
    get:
      tags: [Staff & permissions]
      summary: One staff member
      security: [{ adminCookie: [] }]
      x-rbac: super_admin
      responses:
        '200': { description: Staff member, content: { application/json: { schema: { $ref: '#/components/schemas/StaffMember' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Staff & permissions]
      summary: Edit name, role, page levels and rights (the Save button)
      description: |
        Send only what changes. `grants` / `rights` replace the current ones. A role change signs the person out everywhere.
        Send `ifVersion` (the row's `version`) to get 409 `VERSION_CONFLICT` if someone else saved first.
      security: [{ adminCookie: [] }]
      x-rbac: super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                role: { $ref: '#/components/schemas/StaffRoleEditable' }
                grants: { $ref: '#/components/schemas/Grants' }
                rights: { type: array, items: { $ref: '#/components/schemas/SpecialRight' } }
                ifVersion: { type: integer }
            example:
              grants: { overview: view, payouts: manage, traders: view }
              rights: [payout.approve]
              ifVersion: 3
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/StaffMember' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: VERSION_CONFLICT., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Staff & permissions]
      summary: Delete a staff member
      description: Soft delete; ends every session and removes all access. The super admin and yourself cannot be deleted.
      security: [{ adminCookie: [] }]
      x-rbac: super_admin
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { type: object } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: SELF_DELETE., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/admin/staff/{id}/{action}:
    post:
      tags: [Staff & permissions]
      summary: Row action (suspend, restore, force sign-out, reset 2FA, reset password)
      description: |
        - `suspend`: blocks sign-in and ends every session. `restore` undoes it.
        - `force-logout`: ends every session now.
        - `reset-2fa`: next sign-in shows a new QR code.
        - `reset-password`: body `{ password }` (temporary, 8+ chars); ends every session.

        Optional `reason` goes to the audit log. Not allowed on the super admin (403 `PROTECTED`) or yourself (409 `SELF_ACTION`).
      security: [{ adminCookie: [] }]
      x-rbac: super_admin
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { name: action, in: path, required: true, schema: { type: string, enum: [suspend, restore, force-logout, reset-2fa, reset-password] } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
                password: { type: string, minLength: 8, description: Only for reset-password. }
      responses:
        '200': { description: Updated row, content: { application/json: { schema: { $ref: '#/components/schemas/StaffMember' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: SELF_ACTION., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }


  # ----------------------------------------------------------------- Markets
  /api/v1/markets:
    get:
      tags: [Markets]
      summary: All enabled markets with live price, limits and feed health
      x-rbac: public
      security: []
      responses:
        '200': { description: Markets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Market' } } } } }
  /api/v1/markets/feed/status:
    get:
      tags: [Markets]
      summary: Health of the live Hyperliquid feed
      description: Connection state, active staleness limits and the age of every book / mark price.
      x-rbac: public
      security: []
      responses:
        '200': { description: Feed status, content: { application/json: { schema: { $ref: '#/components/schemas/FeedStatus' } } } }
  /api/v1/markets/{symbol}:
    get:
      tags: [Markets]
      summary: One market
      x-rbac: public
      security: []
      parameters: [{ $ref: '#/components/parameters/SymbolParam' }]
      responses:
        '200': { description: Market, content: { application/json: { schema: { $ref: '#/components/schemas/Market' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/markets/{symbol}/price:
    get:
      tags: [Markets]
      summary: Latest price tick (mid, bid, ask, mark, oracle, funding, freshness)
      x-rbac: public
      security: []
      parameters: [{ $ref: '#/components/parameters/SymbolParam' }]
      responses:
        '200': { description: Price, content: { application/json: { schema: { $ref: '#/components/schemas/PriceTick' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: NO_PRICE - no price received yet., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/markets/{symbol}/book:
    get:
      tags: [Markets]
      summary: Order book snapshot (best levels first)
      parameters:
        - { $ref: '#/components/parameters/SymbolParam' }
        - { name: depth, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
      x-rbac: public
      security: []
      responses:
        '200': { description: Book, content: { application/json: { schema: { $ref: '#/components/schemas/OrderBook' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: NO_PRICE - no order book yet., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------------------------------------------------------------- Terminal
  /api/v1/terminal/bootstrap:
    get:
      tags: [Terminal]
      summary: First paint of the terminal in one request
      description: Markets table, selected market, order book, recent trades and chart settings. An unknown or missing `symbol` falls back to the first enabled market. A market without data yet gives a null book and an empty trades list instead of an error.
      x-rbac: public
      security: []
      parameters:
        - { name: symbol, in: query, required: false, schema: { type: string, maxLength: 20 } }
      responses:
        '200': { description: Bootstrap, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalBootstrap' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: No market is enabled., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/terminal/markets:
    get:
      tags: [Terminal]
      summary: Markets table (live price, 24h change, volume, open interest, funding, leverage, fees)
      x-rbac: public
      security: []
      responses:
        '200':
          description: Enabled markets
          content:
            application/json:
              schema:
                type: object
                properties:
                  markets: { type: array, items: { $ref: '#/components/schemas/TerminalMarket' } }
                  serverTime: { type: integer }
  /api/v1/terminal/markets/{symbol}:
    get:
      tags: [Terminal]
      summary: One market (market bar)
      x-rbac: public
      security: []
      parameters: [{ $ref: '#/components/parameters/SymbolParam' }]
      responses:
        '200': { description: Market, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalMarket' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/terminal/markets/{symbol}/book:
    get:
      tags: [Terminal]
      summary: Order book with depth and price grouping
      description: Levels come from the live Hyperliquid book (20 raw levels per side), so a very large `group` returns fewer rows. Use the `groups` list of the response to offer sensible steps.
      x-rbac: public
      security: []
      parameters:
        - { $ref: '#/components/parameters/SymbolParam' }
        - { name: depth, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 15 } }
        - { name: group, in: query, description: 'Price step as a positive decimal string, for example `10`. Omit for raw levels.', schema: { type: string, pattern: '^\d+(\.\d+)?$' } }
      responses:
        '200': { description: Book, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalBook' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: NO_PRICE - no order book received yet., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/terminal/markets/{symbol}/trades:
    get:
      tags: [Terminal]
      summary: Latest public trades (newest first)
      description: Kept in memory only (last 200 per symbol), so the tape starts empty after a backend restart and fills from the live feed.
      x-rbac: public
      security: []
      parameters:
        - { $ref: '#/components/parameters/SymbolParam' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Trades, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalTrades' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/terminal/markets/{symbol}/candles:
    get:
      tags: [Terminal]
      summary: Chart history (oldest first)
      description: Loaded from Hyperliquid through our backend. Identical requests share one Hyperliquid call and are cached for 2 s (finished history 60 s). The forming candle is updated over the WebSocket channel `candles`.
      x-rbac: public
      security: []
      parameters:
        - { $ref: '#/components/parameters/SymbolParam' }
        - { name: interval, in: query, schema: { $ref: '#/components/schemas/CandleInterval' } }
        - { name: startTime, in: query, description: Unix ms., schema: { type: integer, minimum: 1 } }
        - { name: endTime, in: query, description: Unix ms., schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 500 } }
      responses:
        '200': { description: Candles, content: { application/json: { schema: { $ref: '#/components/schemas/TerminalCandles' } } } }
        '400': { description: 'Validation failed, unsupported interval, or startTime not before endTime.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Hyperliquid candle data is temporarily unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: MARKET_DATA_UNAVAILABLE, message: Candle data is temporarily unavailable, requestId: 3f0c... }

  # ----------------------------------------------------------------- Trading
  /api/v1/trading/accounts:
    get:
      tags: [Trading]
      summary: My trading accounts
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER
      responses:
        '200': { description: Accounts (with plan name), content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/trading/accounts/{accountId}:
    get:
      tags: [Trading]
      summary: Live account overview (balance, equity, margin, exposure, open positions)
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
      responses:
        '200': { description: Overview, content: { application/json: { schema: { $ref: '#/components/schemas/AccountOverview' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/trading/accounts/{accountId}/orders:
    parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
    post:
      tags: [Trading]
      summary: Place an order (market, limit, stop, take profit, stop loss)
      description: |
        Idempotent: send the `Idempotency-Key` header (max 64 chars) or `clientOrderId` in the body. A replay returns HTTP 200
        with `duplicate: true`; a new order returns 201. Limited to 30 writes per second per user.
        Fills are posted through the ledger (`REALIZED_PNL`, `FEE`) and risk rules are re-checked right after a trade.
        Limits (editable in the `trading` setting): 50 open orders, 20 open position legs, 10 exit orders per position,
        gross exposure <= 10x equity for new exposure.
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
            examples:
              market: { value: { symbol: BTC, side: BUY, type: MARKET, size: '0.01', leverage: 5, maxSlippagePct: '1' } }
              limit: { value: { symbol: ETH, side: SELL, type: LIMIT, size: '0.5', limitPrice: '3200.5', timeInForce: GTC, postOnly: true } }
              stopLoss: { value: { symbol: BTC, side: SELL, type: STOP_LOSS, triggerPrice: '60000', closePosition: true } }
      responses:
        '200': { description: Duplicate request (already processed), content: { application/json: { schema: { $ref: '#/components/schemas/PlaceOrderResult' } } } }
        '201': { description: Order accepted, content: { application/json: { schema: { $ref: '#/components/schemas/PlaceOrderResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Trading]
      summary: List orders (newest first)
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters:
        - { name: active, in: query, description: 'true = only working orders (NEW / PARTIALLY_FILLED).', schema: { type: string, enum: ['true', 'false'] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Orders, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Trading]
      summary: Cancel all working orders (entries and exits)
      description: Optionally only one symbol and/or side. Does not close positions.
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters:
        - { name: symbol, in: query, schema: { type: string, maxLength: 20 } }
        - { name: side, in: query, schema: { $ref: '#/components/schemas/OrderSide' } }
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { type: object, properties: { canceled: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/trading/accounts/{accountId}/orders/{orderId}:
    parameters:
      - { $ref: '#/components/parameters/AccountIdParam' }
      - { $ref: '#/components/parameters/OrderIdParam' }
    get:
      tags: [Trading]
      summary: One order with its fills
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Order'
                  - type: object
                    properties:
                      fills: { type: array, items: { $ref: '#/components/schemas/Fill' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Trading]
      summary: Modify price / trigger / size
      description: The replacement is fully validated first, then the old order is cancelled in the same transaction (returns the new order).
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModifyOrderRequest' }
      responses:
        '200': { description: Replacement order, content: { application/json: { schema: { $ref: '#/components/schemas/PlaceOrderResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Trading]
      summary: Cancel one order (idempotent)
      description: Works even while prices are stale. Releases the reserved margin.
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      responses:
        '200': { description: Cancelled order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/trading/accounts/{accountId}/positions/{symbol}/close:
    post:
      tags: [Trading]
      summary: Close a position (whole, or `size` for a partial close)
      description: |
        Reduce-only market order at the live book. A thin book gives a partial fill and the rest stays open.
        In hedge mode with both legs open, `positionSide` is required (`POSITION_SIDE_REQUIRED`).
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters:
        - { $ref: '#/components/parameters/AccountIdParam' }
        - { $ref: '#/components/parameters/SymbolParam' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClosePositionRequest' }
      responses:
        '200': { description: Close result, content: { application/json: { schema: { $ref: '#/components/schemas/PlaceOrderResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No open position in this market., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/trading/accounts/{accountId}/positions/close-all:
    post:
      tags: [Trading]
      summary: Close all positions (or only longs / only shorts)
      description: Each market is closed in its own transaction. Per-market errors are returned in `results[].error`, nothing is reported closed unless it was.
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { side: { $ref: '#/components/schemas/PositionSide' } } }
      responses:
        '200': { description: Per-market results, content: { application/json: { schema: { $ref: '#/components/schemas/CloseAllResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/trading/accounts/{accountId}/position-mode:
    put:
      tags: [Trading]
      summary: Switch ONE_WAY / HEDGE
      description: Only while the account has no open positions and no working orders (`POSITION_MODE_LOCKED` otherwise).
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [mode], properties: { mode: { $ref: '#/components/schemas/PositionMode' } } }
      responses:
        '200': { description: Mode set, content: { application/json: { schema: { type: object, properties: { positionMode: { $ref: '#/components/schemas/PositionMode' } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/trading/accounts/{accountId}/fills:
    get:
      tags: [Trading]
      summary: Fill history (latest 50)
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
      responses:
        '200': { description: Fills, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Fill' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/trading/accounts/{accountId}/ledger:
    get:
      tags: [Trading]
      summary: Ledger (realized PnL, fees, funding, adjustments; latest 100)
      security: [{ customerCookie: [] }]
      x-rbac: portal:TRADER + ownership
      parameters: [{ $ref: '#/components/parameters/AccountIdParam' }]
      responses:
        '200': { description: Ledger entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------ Admin markets
  /api/v1/admin/markets:
    get:
      tags: [Admin markets]
      summary: Market registry (all markets, including disabled)
      security: [{ adminCookie: [] }]
      x-rbac: section:markets:view
      responses:
        '200': { description: Markets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminMarket' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/markets/sync:
    post:
      tags: [Admin markets]
      summary: Sync the registry from Hyperliquid
      description: |
        Only symbols in `LAUNCH_SYMBOLS` are stored. Runs at startup too. New symbols get the reviewed catalog limits; a symbol without a
        reviewed row is created **disabled**. A delisted contract becomes **close-only**. Admin edits are never overwritten; a lower
        Hyperliquid leverage limit always wins. Writes an audit log entry.
      security: [{ adminCookie: [] }]
      x-rbac: section:markets:manage + right:market.sync
      responses:
        '200': { description: Number of markets synced, content: { application/json: { schema: { type: object, properties: { synced: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/markets/{id}:
    patch:
      tags: [Admin markets]
      summary: Edit a market (enable, halt, close-only, limits, fees)
      description: Any change to limits or fees starts a new `riskTierVersion`, stored on every later fill. The live feed starts/stops tracking the symbol with `isEnabled`. Writes an audit log entry.
      security: [{ adminCookie: [] }]
      x-rbac: section:markets:manage
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMarketUpdate' }
            example: { isCloseOnly: true, maxNotionalUsd: 500000, takerFeeRate: 0.0004 }
      responses:
        '200': { description: Updated market, content: { application/json: { schema: { $ref: '#/components/schemas/AdminMarket' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

